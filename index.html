<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humor Precedents</title>
<style>
:root{
  --ink:#0b0b0b; --mute:#8b8b8b; --line:#b4b4b4; --soft:#efefef; --bg:#fff;
  --bar:34px;
  --sans:"Helvetica Neue","Neue Haas Grotesk Text",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:var(--bar);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.42 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:1px}
.mono{font:11px/1.35 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.mute{color:var(--mute)}

/* Banner */
#bar{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 12px;border-bottom:1px solid var(--line)}
#bar a,#bar button{white-space:nowrap}
#bar a.on{text-decoration:underline;text-underline-offset:3px}
#bar a:hover,#bar button:hover{color:var(--mute)}
.lang b{font-weight:400;text-decoration:underline;text-underline-offset:3px}
.lang span{color:var(--mute)}
#net{min-width:64px;text-align:right;color:var(--mute)}
#net.err{color:var(--ink);text-decoration:underline}

/* Hero */
#hero{position:relative;margin-top:var(--bar);height:calc(100svh - var(--bar));overflow:hidden;background:var(--bg)}
.hcell{position:absolute;display:block;background:var(--soft);transition:transform .15s}
.hcell img{display:block;width:100%;height:100%;object-fit:cover;outline:1px solid rgba(0,0,0,.1);outline-offset:-1px}
.hcell span{position:absolute;left:0;bottom:0;background:var(--bg);padding:1px 4px;opacity:0}
.hcell:hover,.hcell:focus-visible{z-index:9999!important;transform:scale(1.08)}
.hcell:hover span,.hcell:focus-visible span{opacity:1}
#hero:has(.hcell:hover) .hcell:not(:hover) img{opacity:.4}
#hero img{transition:opacity .15s}
#hero.spread .hcell{animation:spread .85s cubic-bezier(.16,.84,.3,1) var(--d) backwards}
@keyframes spread{from{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
img.broken{visibility:hidden}

/* Archive */
.a-top{display:flex;flex-direction:column;gap:14px;padding:16px 24px 12px;border-top:1px solid var(--line)}
.thesis{max-width:620px}
.thesis label{display:block;margin-bottom:6px}
.thesis textarea{width:100%;border:0;padding:0;resize:none;background:none;font-size:20px;line-height:1.25;letter-spacing:-.01em;outline-offset:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.tools input[type=search]{border:0;border-bottom:1px solid var(--line);padding:2px 0;width:220px;background:none;border-radius:0}
.tools input[type=search]::placeholder{color:var(--mute)}
.tools button:hover,.sort button:hover{color:var(--mute)}
.sort button.on{text-decoration:underline;text-underline-offset:3px}
.tools .gap{flex:1}
.sec{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 24px 6px;border-bottom:1px solid var(--line)}
.sec span{font-size:14px;padding-bottom:6px}
.sec strong{font-weight:400;font-size:clamp(48px,6.2vw,92px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.sec.grey,.sec.grey strong{color:var(--mute)}
.none{padding:48px 24px;color:var(--mute)}

.row{border-bottom:1px solid var(--line);scroll-margin-top:var(--bar)}
.row-sum{display:grid;grid-template-columns:clamp(128px,14vw,200px) 1fr 1fr;min-height:150px;cursor:pointer}
.row-sum:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.c-left{display:flex;flex-direction:column;gap:10px;padding:20px 16px 20px 24px}
.thumb{display:block;width:100%;aspect-ratio:1;background:var(--soft);border-radius:3px;overflow:hidden;flex:none}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.stamp{font-size:20px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stamp b,.stamp i{display:block;font-weight:400;font-style:normal}
.stamp i{color:var(--mute)}
.c-main,.c-desc{display:flex;flex-direction:column;gap:7px;padding:18px 24px 20px 20px;min-width:0}
.c-main{border-left:1px solid var(--line)}
.row-sum h3{margin:0 0 5px;font-weight:400;font-size:22px;line-height:1.12;letter-spacing:-.02em;overflow-wrap:anywhere}
.row-sum h3.un{color:var(--mute)}
.c-main p{margin:0;font-size:13px;line-height:1.32;overflow-wrap:anywhere}
.c-main a{text-decoration:underline;text-underline-offset:2px}
.c-main a:hover{color:var(--mute)}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:pre-line;color:#555}
.pills{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px}
.pills:empty{display:none}
.pill{border:1px solid var(--ink);border-radius:2px;padding:0 4px;font-size:11px;line-height:15px;white-space:nowrap}
.pill.grey{border-color:var(--mute);color:var(--mute)}
.c-desc p{margin:0;font-size:14px;line-height:1.32;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:12;overflow:hidden;white-space:pre-line}
.c-desc p.un{color:var(--mute)}
.row.open .row-sum{background:var(--soft)}
@media (min-width:761px){
  .row.open .row-sum{grid-template-columns:32.6% 1fr 1fr}
  .row.open .thumb{width:88px}
}

/* Row editor */
.ed{display:grid;grid-template-columns:32.6% 1fr;border-top:1px solid var(--line)}
.ed-img{padding:20px 20px 24px 24px}
.ed-img .big{background:var(--soft);min-height:120px}
.ed-img img{display:block;width:100%;height:auto;max-height:70svh;object-fit:contain}
.ed-img .ctl{margin-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.ed-body{border-left:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;min-width:0}
.block{padding:18px 24px 22px 20px;min-width:0;border-bottom:1px solid var(--line)}
.block:nth-child(odd){border-right:1px solid var(--line)}
.block:nth-last-child(-n+2){border-bottom:0}
.block h4{margin:0 0 14px;font:inherit}
.f{display:block;margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f>span{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--mute)}
.f>span button{color:var(--ink);text-decoration:underline;text-underline-offset:2px;text-transform:uppercase}
textarea{field-sizing:content}
textarea.t,input.t,select.t{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0 5px;background:none;resize:none;line-height:1.35;overflow:hidden}
textarea.t::placeholder,input.t::placeholder{color:#a9a9a9}
textarea.t:focus,input.t:focus,select.t:focus{outline:0;border-bottom-color:var(--ink)}
.obs textarea.t{font-size:16px}
.ro .empty{display:none}
.ro textarea.t,.ro input.t{border-bottom:0}
.dim{margin-bottom:12px}
.dim:last-child{margin-bottom:0}
.dim>span{display:block;margin-bottom:5px;color:var(--mute)}
.pick{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.pick button{border:1px solid var(--line);border-radius:2px;padding:0 5px;font-size:12px;line-height:19px;color:#555}
.pick button:hover{border-color:var(--ink);color:var(--ink)}
.pick button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick input{border:0;border-bottom:1px solid var(--line);width:88px;padding:0 2px;font-size:12px;line-height:19px;background:none;border-radius:0}
.ro .pick button:not(.on){display:none}
.ro .pick button{cursor:default}

/* Filter */
#filter{margin-top:var(--bar);min-height:calc(100svh - var(--bar))}
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);position:sticky;top:var(--bar);background:var(--bg);z-index:10;flex-wrap:wrap}
.fcell{position:relative;border-right:1px solid var(--line)}
.fcell>button{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 12px;min-width:118px;width:100%}
.fcell>button:hover{background:var(--soft)}
.fcell>button.active{background:var(--ink);color:var(--bg)}
.fcount{margin-left:auto;padding:9px 12px;display:flex;gap:16px;align-items:center}
.fcount button{text-decoration:underline;text-underline-offset:3px}
.pop{position:absolute;left:-1px;top:100%;background:var(--bg);border:1px solid var(--ink);width:232px;max-height:60svh;overflow:auto;z-index:20;padding:6px 0}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 10px;cursor:pointer}
.pop label:hover{background:var(--soft)}
.pop input{accent-color:var(--ink);margin:0}
.pop label em{margin-left:auto;font-style:normal;color:var(--mute);font-size:11px}
.pop .pclear{display:block;padding:6px 10px 2px;text-decoration:underline}
.gbar{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.gbar button{white-space:nowrap}
.gbar button.on{text-decoration:underline;text-underline-offset:3px}
.gbar button:hover{color:var(--mute)}
.gbar .gap{flex:1}
.grp{display:grid;grid-template-columns:32.6% 1fr;border-bottom:1px solid var(--line);min-height:150px}
.grp-l{display:flex;flex-direction:column;justify-content:space-between;padding:8px 12px;gap:18px}
.grp-h{display:flex;justify-content:space-between;gap:12px}
.grp-h u{text-underline-offset:2px}
.grp-h button{font:15px/1 var(--mono);width:18px;height:18px}
.grp-f{display:flex;justify-content:space-between}
.grp-f button{color:var(--mute)}
.grp-f button.on{color:var(--ink)}
.grp-r{padding:8px 12px 8px 0;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-width:0}
.tile{display:block;height:var(--h,120px);background:var(--soft);max-width:100%}
.tile img{display:block;height:100%;width:100%;object-fit:cover}
.tile:hover{opacity:.7}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px 20px;width:100%;padding:2px 0 10px}
.notes a{display:block}
.notes a:hover h5{text-decoration:underline}
.notes h5{margin:2px 0 3px;font-weight:400;font-size:15px;line-height:1.2}
.notes p{margin:0;font-size:13px;line-height:1.32;white-space:pre-line}

/* Cluster view */
.fcount .vtoggle button{text-decoration:none;color:var(--mute)}
.fcount .vtoggle button.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.cl{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.cl-lines{position:absolute;inset:0;z-index:4000;pointer-events:none}
.cl-lines line{stroke:var(--ink);stroke-opacity:.3;stroke-width:.75}
.cl-t{position:absolute;display:block;background:var(--soft);transition:opacity .12s,transform .12s}
.cl-t img{display:block;width:100%;height:100%;object-fit:cover;outline:1px solid rgba(0,0,0,.14);outline-offset:-1px}
.cl-t:hover,.cl-t:focus-visible{z-index:4500!important;transform:scale(1.9)}
.cl.hl .cl-t:not(.on){opacity:.22}
.cl.hl .cl-t.on{z-index:4400!important}
.cl.hl .cl-lines line{stroke-opacity:.08}
.cl.hl .cl-lines line.on{stroke-opacity:1;stroke-width:1.5}
.cl-k{position:absolute;z-index:5000;transform:translate(-50%,-50%);background:var(--bg);padding:0 5px;line-height:1.08;letter-spacing:-.025em;white-space:nowrap;pointer-events:none}
.cl-k small{font:10px/1 var(--mono);letter-spacing:0;margin-left:4px;color:var(--mute)}

/* Focus */
#focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-columns:1fr minmax(320px,34%)}
.fx-img{padding:24px;min-height:0;display:flex;align-items:center;justify-content:center}
.fx-img img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.fx-side{border-left:1px solid var(--line);display:flex;flex-direction:column;padding:12px 20px 14px;min-height:0;overflow:auto}
.fx-top{display:flex;justify-content:space-between;margin-bottom:auto;padding-bottom:28px}
.fx-side .f{margin-bottom:24px}
.fx-side textarea.t{font-size:17px}
.fx-nav{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:24px}
.fx-nav button:hover,.fx-top button:hover{color:var(--mute)}
.fx-big{font-size:clamp(40px,4.4vw,64px);letter-spacing:-.04em;line-height:1;margin-bottom:26px;font-variant-numeric:tabular-nums}

/* Modal, toast, drop */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.38);display:flex;align-items:flex-start;justify-content:center;padding:8svh 16px;overflow:auto}
.box{background:var(--bg);width:100%;max-width:520px;padding:14px 16px 16px}
.box.wide{max-width:760px}
.box-h{display:flex;justify-content:space-between;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.box p{margin:0 0 14px;line-height:1.45}
.box-a{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);padding:5px 10px}
.btn:hover,.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:#444}
.m-dim{margin-bottom:20px}
.m-grid{display:grid;grid-template-columns:1fr 1fr 34px 130px 22px;gap:4px 10px;align-items:center}
.m-grid select{width:100%;border:0;border-bottom:1px solid var(--line);background:none;font-size:12px;border-radius:0;padding:3px 0}
.m-head{display:grid;grid-template-columns:1fr 1fr 170px;gap:10px;margin-bottom:8px}
#toast{position:fixed;left:12px;bottom:12px;z-index:70;background:var(--ink);color:var(--bg);padding:6px 9px;max-width:min(520px,calc(100vw - 24px));text-transform:none}
#drop{position:fixed;inset:var(--bar) 0 0 0;z-index:55;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:clamp(40px,6vw,88px);letter-spacing:-.04em;pointer-events:none}

@media (prefers-reduced-motion:reduce){.cl-t{transition:none}#hero img,.hcell{transition:none}#hero.spread .hcell{animation:none}}
@media (max-width:560px){
  .row-sum{grid-template-columns:104px 1fr;min-height:0}
  .c-left{grid-row:span 2;padding:14px 10px 14px 16px}
  .stamp{font-size:16px}
  .c-main{border-left:0;padding:14px 16px 8px 0}
  .row-sum h3{font-size:18px}
  .c-desc{padding:6px 16px 14px 0}
}
@media (max-width:760px){
  #bar{gap:10px;padding:0 10px}
  #bar .brand,#bar #net{display:none}
  .a-top{padding:16px}
  .tools .gap{display:none}
  .sec{padding:16px 16px 6px}
  .ed{grid-template-columns:1fr}
  .ed-img{padding:16px}
  .ed-body{border-left:0;border-top:1px solid var(--line);grid-template-columns:1fr}
  .block{padding:16px;border-right:0!important;border-bottom:1px solid var(--line)!important}
  .block:last-child{border-bottom:0!important}
  .fcell{flex:1 1 33%}
  .fcell>button{min-width:0}
  .pop{left:0}
  .grp{grid-template-columns:1fr}
  .grp-r{padding:0 12px 10px}
  #focus{grid-template-columns:1fr;grid-template-rows:38svh 1fr}
  .fx-side{border-left:0;border-top:1px solid var(--line)}
  .fx-img{padding:10px}
  .m-grid{grid-template-columns:1fr 1fr 26px;}
  .m-grid select{grid-column:1/3}
  .m-head{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header id="bar" class="mono"></header>
<main id="home">
  <section id="hero" aria-label="All images"></section>
  <section id="archive">
    <div class="a-top" id="atop"></div>
    <div id="list"></div>
  </section>
</main>
<main id="filter" hidden></main>
<div id="focus" hidden></div>
<div id="modal" hidden></div>
<div id="toast" class="mono" hidden></div>
<div id="drop" hidden></div>
<input id="picker" type="file" accept="image/*" multiple hidden>
<input id="draftpicker" type="file" accept=".json,application/json" hidden>

/* Storage: local first, then a coalesced write queue flushed to the Sheet. */
function applyLocal(op){
  if(op.op==='delete'){S.tags=S.tags.filter(x=>x.key!==op.key);return;}
  if(op.sheet==='Settings'){S.settings[op.key]=op.patch.value;return;}
  const [list,k]=op.sheet==='Images'?[S.images,'id']:[S.tags,'key'];
  let row=list.find(x=>x[k]===op.key);
  if(!row){row={[k]:op.key};list.push(row);}
  Object.assign(row,op.patch);
}
function enqueue(q,op){
  const last=[...q].reverse().find(x=>x.sheet===op.sheet&&x.key===op.key);
  if(op.op==='upsert'&&last&&last.op==='upsert')Object.assign(last.patch,op.patch);
  else q.push(JSON.parse(JSON.stringify(op)));
}
let cacheTimer,flushTimer;
function persist(){
  LS.set('queue',[...S.inflight,...S.queue]);
  clearTimeout(cacheTimer);
  cacheTimer=setTimeout(()=>LS.set('cache',{images:S.images,tags:S.tags,settings:S.settings}),250);
}
function commitOp(op){applyLocal(op);enqueue(S.queue,op);persist();scheduleFlush();}
const patch=(sheet,key,p)=>commitOp({op:'upsert',sheet,key,patch:p});
const remove=(sheet,key)=>commitOp({op:'delete',sheet,key});
function scheduleFlush(delay=700){
  if(!canSync()){setNet();return;}
  setNet('saving');
  clearTimeout(flushTimer);
  flushTimer=setTimeout(flush,delay);
}
async function post(body){
  const res=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,...body})});
  const data=await res.json();
  if(!data.ok)throw new Error(data.error||'failed');
  return data;
}
async function flush(){
  if(S.flushing||!canSync())return;
  if(!S.queue.length){setNet('saved');return;}
  S.flushing=true;S.inflight=S.queue;S.queue=[];
  let retry=false;
  try{
    await post({action:'batch',ops:S.inflight});
    S.inflight=[];
  }catch(e){
    const merged=[];[...S.inflight,...S.queue].forEach(o=>enqueue(merged,o));
    S.queue=merged;S.inflight=[];retry=true;
    setNet('offline');
    if(e.message==='bad_token')toast(t('connFail'));
  }
  S.flushing=false;persist();
  if(retry)flushTimer=setTimeout(flush,8000);
  else if(S.queue.length)scheduleFlush(300);
  else setNet('saved');
}
function setNet(v){
  if(v)S.net=v;
  if(!S.url)S.net='local';else if(!S.token)S.net='readonly';
  const el=$('#net');if(!el)return;
  el.textContent=t(S.net==='local'?'local':S.net==='readonly'?'readonly':S.net==='saving'?'saving':S.net==='offline'?'offline':'saved');
  el.classList.toggle('err',S.net==='offline');
}

async function pull(){
  try{
    const res=await fetch(S.url);
    const d=await res.json();
    if(!d.ok)throw new Error(d.error);
    S.needSetup=!d.tags.length;
    if(S.needSetup){toast(t('notSetup'));setNet('offline');return false;}
    S.images=d.images;S.tags=d.tags;S.settings=d.settings;
    S.queue.forEach(applyLocal);
    const moved=migrateBilingual();

    if(!busy&&!S.open&&S.focus===null){renderAll();route(true);}else{renderBar();}
    if(canSync())scheduleFlush(100);else setNet();
    if(moved&&canSync())finishMigration();
    return true;
  }catch(e){S.pullError=e.message;setNet('offline');return false;}
}

function renameTag(dim,oldZh,zh,en){

/* Hero: each image takes the nearest free spot on a jittered spiral from the screen center.
   Randomness is seeded by image ID, so the arrangement stays put between visits. */
function seeded(str){
  let h=1779033703^str.length;
  for(const c of str){h=Math.imul(h^c.charCodeAt(0),3432918353);h=h<<13|h>>>19;}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};
}
function scatter(items,W,H){
  const M=14,cx=W/2,cy=H/2,LAST_TRY=14;
  const stretch=Math.sqrt(W/H);
  const base=Math.min(W*H*.022,W*H*.4/items.length);
  const step=Math.sqrt(base)*.2;
  const maxJ=Math.min(9000,Math.ceil((Math.hypot(W,H)/1.6/step)**2));
  const spec=items.map(r=>{
    const rnd=seeded(r.id),v=rnd();
    return{r,seed:r.id,k:.5+1.5*v*v,loose:rnd()<.2,gap:3+rnd()*16};
  });
  for(let attempt=0,scale=1;;attempt++,scale*=.93){
    const area=base*scale,placed=[];
    let failed=false,reach=0;
    for(const s of spec){
      const a=aspect(s.r),rnd=seeded(s.seed+'p');
      const w=Math.sqrt(area*s.k*a),h=w/a;
      const g=s.loose?-Math.min(w,h)*.24:s.gap;
      let spot=null;
      for(let j=Math.floor(reach*.6);j<maxJ&&!spot;j++){
        const ang=j*2.39996+rnd()*1.4,rad=step*Math.sqrt(j)*(.8+rnd()*.45);
        const x=cx+Math.cos(ang)*rad*stretch-w/2,y=cy+Math.sin(ang)*rad/stretch-h/2;
        if(x<M||y<M||x+w>W-M||y+h>H-M)continue;
        if(placed.every(o=>x>=o.x+o.w+g||x+w+g<=o.x||y>=o.y+o.h+g||y+h+g<=o.y)){spot={x,y};reach=Math.max(reach,j);}
      }
      if(!spot){
        if(attempt<LAST_TRY){failed=true;break;}
        spot={x:M+rnd()*Math.max(0,W-w-2*M),y:M+rnd()*Math.max(0,H-h-2*M)};
      }
      placed.push({r:s.r,x:spot.x,y:spot.y,w,h});
    }
    if(!failed){
      const left=Math.min(...placed.map(p=>p.x)),right=Math.max(...placed.map(p=>p.x+p.w));
      const top=Math.min(...placed.map(p=>p.y)),bottom=Math.max(...placed.map(p=>p.y+p.h));
      const dx=(W-left-right)/2,dy=(H-top-bottom)/2;
      placed.forEach(p=>{p.x+=dx;p.y+=dy;});
      return placed;
    }
  }
}
function layoutHero(){
  const el=$('#hero');
  if(S.page!=='home')return;
  const items=visible();
  if(!items.length){el.innerHTML=`<p class="none">${t('empty')}</p>`;S.heroHTML='';return;}
  const W=el.clientWidth,H=el.clientHeight;
  if(!W||!H)return;
  const html=scatter(items,W,H).map((p,i)=>{
    const dx=W/2-p.x-p.w/2,dy=H/2-p.y-p.h/2;
    return `<a class="hcell" href="#/archive/${p.r.id}" style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px;width:${p.w.toFixed(1)}px;height:${p.h.toFixed(1)}px;z-index:${i+1};--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--d:${Math.min(i*16,650)}ms"><img src="${esc(imgSrc(p.r))}" alt="${esc(text(p.r,'title')||p.r.id)}"><span class="mono">${shortId(p.r.id)}</span></a>`;
  }).join('');
  if(html===S.heroHTML)return;
  S.heroHTML=html;
  if(!S.heroPlayed){
    S.heroPlayed=true;
    el.classList.add('spread');
    setTimeout(()=>el.classList.remove('spread'),2200);
  }
  el.innerHTML=html;
}

/* Filter */
function filterFields(){
  return [...dimsList().map(d=>({id:d.dim,label:dimLabel(d)})),{id:'_obs',label:t('obsFilter')},{id:'_status',label:t('status')}];
}
function vals(r,f){
  if(f==='_obs')return[isObserved(r)?'yes':'no'];
  if(f==='_status')return[r.status||'active'];
  const a=rowTags(r,f);return a.length?a:[''];
}
function passes(r,except){
  if(except!=='_status'&&!(S.filters._status||[]).length&&r.status==='removed')return false;
  for(const f in S.filters){
    if(f===except||!S.filters[f].length)continue;
    if(!vals(r,f).some(v=>S.filters[f].includes(v)))return false;
  }
  return true;
}
function optionsOf(f){
  if(f==='_obs')return[['yes',t('yes')],['no',t('no')]];
  if(f==='_status')return['active','doubt','removed'].map(k=>[k,t(k)]);
  return[...tagsOf(f).map(x=>[x.zh,tagLabel(f,x.zh)]),['',t('untagged')]];
}
function renderFilter(){

  };
  const groups=[];

  else{

    [...tagsOf(S.groupBy).map(x=>x.zh),''].forEach(z=>{
      const items=list.filter(r=>vals(r,S.groupBy).includes(z));
      if(items.length)groups.push({key:S.groupBy+'::'+z,title:z?tagLabel(S.groupBy,z):t('untagged'),sub:dimLabel(d),items});

  $('#filter').innerHTML=`
    <div class="fbar mono">${fields.map(cell).join('')}

        <span class="vtoggle"><button data-act="fview" data-v="table" class="${S.filterView==='table'?'on':''}">${t('viewTable')}</button> / <button data-act="fview" data-v="cluster" class="${S.filterView==='cluster'?'on':''}">${t('viewCluster')}</button></span></div></div>
    <div class="gbar mono"><span class="mute">${t('groupBy')}</span>
      ${dimsList().map(d=>`<button data-act="group" data-v="${d.dim}" class="${S.groupBy===d.dim?'on':''}">${esc(dimLabel(d))}</button>`).join('')}
      <button data-act="group" data-v="_none" class="${S.groupBy==='_none'?'on':''}">${t('noGroup')}</button>
      <span class="gap"></span>${canEdit()?`<button data-act="manage">${t('manage')}</button>`:''}</div>
    ${S.filterView==='cluster'?'<div class="cl" id="cluster"></div>':(groups.map(g=>groupHTML(g,unit)).join('')||`<p class="none">${t('noMatch')}</p>`)}`;
  if(S.filterView==='cluster')layoutCluster(list);

/* Cluster view: keywords spread over the stage, thumbnails gather around them,
   and an image filed under several keywords is tied together with lines. */
function clusterGroups(list){
  const all=S.groupBy==='_none',out=[];
  dimsList().filter(d=>all||d.dim===S.groupBy).forEach(d=>{
    [...tagsOf(d.dim).map(x=>x.zh),''].forEach(z=>{
      const items=list.filter(r=>vals(r,d.dim).includes(z));
      if(!items.length)return;
      const name=z?tagLabel(d.dim,z):t('untagged')+(all?` · ${dimLabel(d)}`:'');
      out.push({key:d.dim+'::'+z,title:name,items});
    });
  });
  return out;
}
function placeKeywords(groups,W,H,step){
  const placed=[];
  [...groups].sort((a,b)=>b.items.length-a.items.length).forEach(g=>{
    const rnd=seeded(g.key),r=step*Math.sqrt(g.items.length+2);
    const m=Math.min(r,Math.min(W,H)*.22);
    let best=null,bestScore=-Infinity;
    for(let k=0;k<160;k++){
      const x=m+rnd()*(W-2*m),y=m+rnd()*(H-2*m);
      let score=Math.min(x,W-x,y,H-y)*.9;
      placed.forEach(c=>{score=Math.min(score,Math.hypot(x-c.x,y-c.y)-r-c.r);});
      if(score>bestScore){bestScore=score;best={x,y};}
    }
    placed.push({...best,r,g});
  });
  return placed;
}
function shortestLinks(points){
  const links=[],joined=[0],rest=points.map((_,i)=>i).slice(1);
  while(rest.length){
    let pick=null;
    joined.forEach(a=>rest.forEach(b=>{
      const d=Math.hypot(points[a].x-points[b].x,points[a].y-points[b].y);
      if(!pick||d<pick.d)pick={a,b,d};
    }));
    links.push([points[pick.a],points[pick.b]]);
    joined.push(pick.b);rest.splice(rest.indexOf(pick.b),1);
  }
  return links;
}
function layoutCluster(list){
  const stage=$('#cluster');
  if(!stage)return;
  const groups=clusterGroups(list);
  if(!groups.length){stage.innerHTML=`<p class="none">${t('noMatch')}</p>`;return;}
  const top=stage.getBoundingClientRect().top+scrollY;
  const W=stage.clientWidth,H=Math.max(innerHeight-top,440);
  stage.style.height=H+'px';
  if(!W)return;
  const total=groups.reduce((n,g)=>n+g.items.length,0);
  const s=Math.min(92,Math.max(26,Math.sqrt(W*H*.4/total))),step=s*.62;
  const clampTo=(v,lo,hi)=>Math.min(Math.max(v,lo),Math.max(lo,hi));
  const spots=placeKeywords(groups,W,H,step);
  const seen={};
  let thumbs='',words='',z=1;
  spots.forEach(c=>{
    c.g.items.forEach((r,i)=>{
      const rnd=seeded(c.g.key+r.id),a=aspect(r),size=s*(.82+rnd()*.42);
      const w=size*Math.sqrt(a),h=size/Math.sqrt(a);
      const ang=i*2.39996+rnd()*.9,rad=step*Math.sqrt(i+1.6)*(.85+rnd()*.35);
      const x=clampTo(c.x+Math.cos(ang)*rad-w/2,2,W-w-2),y=clampTo(c.y+Math.sin(ang)*rad-h/2,2,H-h-2);
      (seen[r.id]=seen[r.id]||[]).push({x:x+w/2,y:y+h/2});
      thumbs+=`<a class="cl-t" data-i="${r.id}" href="#/archive/${r.id}" title="${esc(text(r,'title')||r.id)}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;z-index:${z++}"><img loading="lazy" decoding="async" src="${esc(imgSrc(r))}" alt="${esc(text(r,'title')||r.id)}"></a>`;
    });
    const font=Math.min(40,13+Math.sqrt(c.g.items.length)*3.2);
    words+=`<div class="cl-k" style="left:${clampTo(c.x,48,W-48).toFixed(1)}px;top:${clampTo(c.y,font,H-font).toFixed(1)}px;font-size:${font.toFixed(1)}px">${esc(c.g.title)}<small>${c.g.items.length}</small></div>`;
  });
  const lines=Object.entries(seen).filter(([,p])=>p.length>1).flatMap(([id,p])=>shortestLinks(p).map(([a,b])=>
    `<line data-i="${id}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`)).join('');
  stage.innerHTML=`${thumbs}<svg class="cl-lines" width="${W}" height="${H}" aria-hidden="true">${lines}</svg>${words}`;
  stage.querySelectorAll('.cl-k').forEach(k=>{
    const half=k.offsetWidth/2;
    k.style.left=clampTo(parseFloat(k.style.left),half,W-half).toFixed(1)+'px';
  });
}
function markCluster(id){
  const stage=$('#cluster');
  if(!stage)return;
  stage.classList.toggle('hl',!!id);
  stage.querySelectorAll('.cl-t,.cl-lines line').forEach(el=>el.classList.toggle('on',!!id&&el.dataset.i===id));
}

/* Focus mode: image and blank fields only, no record shown. */
function openFocus(id){
  blurActive();
  const list=visible();
  if(!list.length)return;
  let i=id?list.findIndex(r=>r.id===id):list.findIndex(r=>!isObserved(r));
  if(i<0)i=0;
  S.focus=i;renderFocus();
}
function renderFocus(){
  const list=visible(),r=list[S.focus];
  const el=$('#focus');el.hidden=false;document.body.style.overflow='hidden';
  el.innerHTML=`<div class="fx-img"><img src="${esc(imgSrc(r))}" alt=""></div>
    <div class="fx-side">

    </div>`;
  growAll(el);

function fxGo(d){blurActive();const n=visible().length;S.focus=(S.focus+d+n)%n;renderFocus();}
function fxEmpty(){
  blurActive();

  for(let k=1;k<=list.length;k++){const i=(S.focus+k)%list.length;if(!isObserved(list[i])){S.focus=i;renderFocus();return;}}

function ask(msg,okLabel){
  return new Promise(done=>{
    openModal(`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="box-a mono"><button class="btn" data-ask="0">${t('cancel')}</button><button class="btn pri" data-ask="1">${esc(okLabel||t('ok'))}</button></div></div>`);
    S.askDone=v=>{S.askDone=null;closeModal();done(v);};
  });
}
let toastTimer;
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200);}
function openSettings(){
  const note=!CAN_STORE?t('noStore'):(S.url&&!S.token)?t('needToken'):'';
  openModal(`<div class="box"><div class="box-h mono"><span>${t('settings')}</span><button data-act="closeModal">${t('close')}</button></div>
    ${note?`<p>${esc(note)}</p>`:''}
    <label class="f"><span class="mono">${t('url')}</span><input class="t" id="s-url" value="${esc(S.url)}" spellcheck="false"></label>
    <label class="f"><span class="mono">${t('token')}</span><input class="t" id="s-token" type="password" value="${esc(S.token)}" autocomplete="off"></label>
    <label class="f"><span class="mono">${t('target')}</span><input class="t" id="s-target" inputmode="numeric" value="${esc(S.settings.target||'100')}"></label>
    <div class="box-a mono">${canEdit()?`<button class="btn" data-act="importDraft">${t('importDraft')}</button>`:''}<button class="btn" data-act="fill">${t('fillTr')}</button><button class="btn pri" data-act="connect">${t('test')}</button></div></div>`);
  if(S.url&&!S.token)$('#s-token').focus();
}
function cleanUrl(value){
  const v=value.replace(/\s+/g,''),id=v.match(/AKfycb[\w-]+/);
  return id?`https://script.google.com/macros/s/${id[0]}/exec`:v;
}
async function connect(){
  const url=cleanUrl($('#s-url').value),token=$('#s-token').value.replace(/\s+/g,''),target=$('#s-target').value.trim();
  if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){toast(t('urlBad'));return;}
  $('#s-url').value=url;
  if(target&&target!==S.settings.target)patch('Settings','target',{value:target});
  S.url=url;S.token=token;LS.set('url',url);LS.set('token',token);
  if(!url){closeModal();renderAll();route(true);return;}
  let failure=t('connFail');
  try{
    if(token){
      try{await post({action:'verify'});}
      catch(e){failure=e.message==='bad_token'?t('tokenBad'):`${t('connFail')} [POST: ${e.message}]`;throw e;}
    }
    failure=`${t('connFail')} [GET]`;
    if(!await pull())throw 0;
    closeModal();renderAll();route(true);toast(token?t('tokenOk'):t('needToken'));
  }catch{
    toast(S.needSetup?t('notSetup'):failure.endsWith('[GET]')?`${t('connFail')} [GET: ${S.pullError}]`:failure);
    setNet('offline');
  }
}

/* Folder access: rename in place, always limited to a folder named resource. */
function idb(){return new Promise((ok,no)=>{const q=indexedDB.open('hp',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);});}
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null);});}catch{return null;}}
async function idbSet(k,v){try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch{}}
async function getDir(){
  if(S.dir)return S.dir;
  if(!window.showDirectoryPicker){toast(t('noFsa'));return null;}
  try{
    let h=await idbGet('dir');
    try{
      if(h&&await h.requestPermission({mode:'readwrite'})==='granted'){
        for await(const name of h.keys())break;
        S.dir=h;return h;
      }
    }catch{/* The remembered folder was moved or deleted, so ask for it again. */}
    h=await showDirectoryPicker({id:'vpresource',mode:'readwrite'});
    if(h.name!=='resource'){toast(t('wrongDir'));return null;}
    await idbSet('dir',h);S.dir=h;return h;
  }catch(e){if(e.name!=='AbortError')toast(e.message);return null;}
}
function highestId(extra=[]){
  return Math.max(+S.settings.last_id||0,...S.images.map(r=>num(r.id)),...extra,0);
}
const extOf=n=>{const e=n.split('.').pop().toLowerCase();return e==='jpeg'?'jpg':e;};
async function exists(dir,name){try{await dir.getFileHandle(name);return true;}catch{return false;}}
async function measure(file){try{const b=await createImageBitmap(file);const o=[b.width,b.height];b.close();return o;}catch{return[0,0];}}
function newRow(id,file,original,w,h){
  patch('Images',id,{file,original_file:original,width:w,height:h,status:'active',updated:new Date().toISOString()});
}
async function storeAs(dir,file,originalName,counter){
  let n=counter.v+1,name;
  do{name=`VP-${String(n).padStart(3,'0')}.${extOf(originalName)}`;if(await exists(dir,name))n++;else break;}while(true);
  counter.v=n;
  const h=await dir.getFileHandle(name,{create:true});
  const w=await h.createWritable();await w.write(file);await w.close();
  const saved=await h.getFile();
  if(saved.size!==file.size)throw new Error('write failed: '+name);
  const [wd,ht]=await measure(file);
  newRow(`VP-${String(n).padStart(3,'0')}`,name,originalName,wd,ht);
  S.local.set(name,URL.createObjectURL(saved));
  return name;
}
async function syncFolder(dir,skipAsk){
  const files=[];
  for await(const [name,h] of dir.entries())if(h.kind==='file'&&IMG_RE.test(name)&&!name.startsWith('.'))files.push({name,h,file:await h.getFile()});
  const known=new Set(S.images.map(r=>r.file));
  const messy=files.filter(f=>!PROPER_RE.test(f.name)).sort((a,b)=>a.file.lastModified-b.file.lastModified||a.name.localeCompare(b.name));
  const orphans=files.filter(f=>PROPER_RE.test(f.name)&&!known.has(f.name));
  if(messy.length&&!skipAsk&&!await ask(t('renameAsk')+messy.length))return;
  const counter={v:highestId(files.map(f=>(f.name.match(PROPER_RE)||[])[1]||0).map(Number))};
  let added=0;
  for(const f of messy){await storeAs(dir,f.file,f.name,counter);await dir.removeEntry(f.name);added++;}
  for(const f of orphans){
    const [wd,ht]=await measure(f.file);
    newRow(f.name.replace(/\.[^.]+$/,''),f.name,'',wd,ht);added++;
  }
  files.filter(f=>PROPER_RE.test(f.name)).forEach(f=>S.local.set(f.name,URL.createObjectURL(f.file)));
  patch('Settings','last_id',{value:String(counter.v)});
  const names=new Set([...S.local.keys()]);
  const miss=S.images.filter(r=>r.status!=='removed'&&!names.has(r.file)).length;
  renderAll();route(true);
  toast(t('synced')+added+(miss?t('missing')+miss:'')+(added&&S.url?t('pushHint'):''));
}
async function importFiles(fileList){
  const files=[...fileList].filter(f=>f.type.startsWith('image/')||IMG_RE.test(f.name));
  if(!files.length)return;
  if(!S.dir&&!await ask(t('needDir'),t('chooseDir')))return;
  const dir=await getDir();
  if(!dir)return;
  const present=[];for await(const [name] of dir.entries()){const m=name.match(PROPER_RE);if(m)present.push(+m[1]);}
  const counter={v:highestId(present)};
  for(const f of files)await storeAs(dir,f,f.name,counter);
  patch('Settings','last_id',{value:String(counter.v)});
  renderAll();route(true);
  toast(t('synced')+files.length+(S.url?t('pushHint'):''));
}

/* Draft import fills blank fields only, so anything already written stays as it is. */
async function importDrafts(file){
  let list;
  try{list=JSON.parse(await file.text());if(!Array.isArray(list))throw 0;}
  catch{toast(t('importBad'));return;}
  let done=0,skipped=0;
  const joined=(cur,add)=>[(cur||'').trimEnd(),add].filter(Boolean).join('\n');
  for(const d of list){
    if(d.add_zh){
      const row=byId(d.id);
      if(!row||(row.see_zh||'').includes(d.add_zh)){skipped++;continue;}
      patch('Images',d.id,{see_zh:joined(row.see_zh,d.add_zh),see_en:joined(row.see_en,d.add_en),updated:new Date().toISOString()});
      done++;continue;
    }
    if(!byId(d.id)&&d.file)newRow(d.id,d.file,d.original_file||'',d.width||0,d.height||0);
    const r=byId(d.id),p={};
    if(!r){skipped++;continue;}
    if(d.source_type&&!r.source_type)p.source_type=d.source_type;
    ['title','see'].forEach(f=>{
      if((r[f+'_zh']||'').trim()||(r[f+'_en']||'').trim()||!d[f+'_zh'])return;
      p[f+'_zh']=d[f+'_zh'];p[f+'_en']=d[f+'_en']||'';
    });
    ['medium','language'].forEach(dim=>{
      const tags=(d[dim]||[]).filter(z=>tagFind(dim,z));
      if(tags.length&&!rowTags(r,dim).length)Object.assign(p,rowTagPatch(dim,tags));
    });
    if(!Object.keys(p).length){skipped++;continue;}
    p.updated=new Date().toISOString();
    patch('Images',d.id,p);done++;
  }
  patch('Settings','last_id',{value:String(highestId())});
  closeModal();renderAll();route(true);
  toast(t('importDone')+done+(skipped?t('importSkip')+skipped:''));
}

/* Routing and rendering */
function renderAll(){renderBar();renderTop();renderArchive();if(S.page==='filter')renderFilter();}
function route(keep){
  if(!keep&&S.focus!==null)exitFocus();
  const [p,id]=location.hash.replace(/^#\/?/,'').split('/');
  S.page=p==='filter'?'filter':'home';
  $('#home').hidden=S.page!=='home';$('#filter').hidden=S.page!=='filter';
  markNav();
  if(S.page==='filter'){renderFilter();if(!keep)scrollTo(0,0);return;}
  layoutHero();
  if(keep)return;
  if(p==='archive'){
    if(id&&byId(id)){
      if(S.open!==id){
        const prev=S.open;S.open=id;S.openObserved=isObserved(byId(id));
        if(prev&&$('#r-'+prev))renderArchive();else if($('#r-'+id))refreshRow(id);else{S.q='';renderTop();renderArchive();}
      }
      const el=$('#r-'+id);if(el)el.scrollIntoView({block:'start'});
    }else $('#archive').scrollIntoView({block:'start'});
  }else if(!p)scrollTo(0,0);
}

const ACTS={
  lang(){blurActive();S.lang=S.lang==='zh'?'en':'zh';LS.set('lang',S.lang);renderAll();layoutHero();if(S.focus!==null)renderFocus();},
  settings:openSettings,closeModal,
  connect,fill:(b)=>fillMissing(b),
  focus(){openFocus(S.open);},
  toggle:b=>toggleRow(b.dataset.id),
  sort(b){S.sort=b.dataset.v;renderTop();renderArchive();},
  import(){$('#picker').click();},
  importDraft(){$('#draftpicker').click();},
  async sync(){const d=await getDir();if(d)syncFolder(d);},
  tag(b){
    if(!canEdit())return;
    const {id,dim,zh}=b.dataset,r=byId(id),list=rowTags(r,dim),i=list.indexOf(zh);
    if(i>=0)list.splice(i,1);else list.push(zh);
    patch('Images',id,rowTagPatch(dim,list));
    b.classList.toggle('on',i<0);
  },
  retr(b){retranslate(b.dataset.id,b.dataset.f.replace(/x$/,''));},
  pop(b){S.pop=S.pop===b.dataset.f?null:b.dataset.f;renderFilter();},
  fclear(b){delete S.filters[b.dataset.f];renderFilter();},
  fclearall(){S.filters={};S.pop=null;renderFilter();},
  group(b){S.groupBy=b.dataset.v;renderFilter();},
  fview(b){S.filterView=b.dataset.v;LS.set('fview',S.filterView);S.pop=null;renderFilter();},
  big(b){const k=b.dataset.k;S.bigGroups.has(k)?S.bigGroups.delete(k):S.bigGroups.add(k);renderFilter();},
  tab(b){b.dataset.v==='note'?S.noteGroups.add(b.dataset.k):S.noteGroups.delete(b.dataset.k);renderFilter();},
  manage:renderManage,
  async deltag(b){
    const {dim,zh}=b.dataset,inUse=S.images.some(r=>rowTags(r,dim).includes(zh));
    if(inUse&&!await ask(t('delTag')))return renderManage();
    replaceTag(dim,zh,null);remove('Tags',`${dim}::${zh}`);renderManage();
  },
  adddim:addDim,
  fxexit:exitFocus,fxgo:b=>fxGo(+b.dataset.d),fxempty:fxEmpty
};

document.addEventListener('click',e=>{
  const askBtn=e.target.closest('[data-ask]');
  if(askBtn&&S.askDone){S.askDone(askBtn.dataset.ask==='1');return;}
  if(e.target.id==='modal'&&!S.askDone){closeModal();afterManage();return;}
  const a=e.target.closest('a[href^="#/"]');
  if(a&&a.getAttribute('href')===location.hash){e.preventDefault();route();return;}
  const b=e.target.closest('[data-act]');
  if(b&&!e.target.closest('a[target="_blank"]')){
    ACTS[b.dataset.act](b);
    if(b.dataset.act==='closeModal')afterManage();
  }
  if(S.pop&&!e.target.closest('.fcell')){S.pop=null;renderFilter();}
});
function afterManage(){if(S.page==='filter')renderFilter();}
['mouseover','focusin'].forEach(type=>document.addEventListener(type,e=>{
  const a=e.target.closest&&e.target.closest('.cl-t');
  if(a)markCluster(a.dataset.i);
}));
['mouseout','focusout'].forEach(type=>document.addEventListener(type,e=>{
  if(e.target.closest&&e.target.closest('.cl-t'))markCluster(null);
}));
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('[data-f]')&&el.dataset.id&&el.tagName!=='SELECT')onFieldInput(el);
  else if(el.id==='q'){S.q=el.value;renderArchive();}
  else if(el.dataset.thesis){autoGrow(el);patch('Settings','thesis_'+el.dataset.thesis,{value:el.value});}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.matches('select[data-f]')){patch('Images',el.dataset.id,{[el.dataset.f]:el.value});return;}
  if(el.matches('[data-f][data-lang]')){onFieldChange(el);return;}
  if(el.dataset.status){patch('Images',el.dataset.status,{status:el.value});S.openObserved=!isObserved(byId(el.dataset.status));layoutHero();renderCounts();return;}
  if(el.dataset.filter){
    const f=el.dataset.filter,v=el.dataset.v,a=S.filters[f]||(S.filters[f]=[]);
    el.checked?a.push(v):a.splice(a.indexOf(v),1);
    renderFilter();return;
  }
  if(el.dataset.thesis){
    const zh=el.dataset.thesis==='zh',v=el.value;
    const out=await tr(v,zh?ZH:EN,zh?EN:ZH);
    if(out!=null)patch('Settings','thesis_'+(zh?'en':'zh'),{value:out});
    return;
  }
  if(el.dataset.rt){
    const row=[...document.querySelectorAll(`[data-rt="${el.dataset.rt}"]`)].filter(x=>x.dataset.old===el.dataset.old);
    renameTag(el.dataset.rt,el.dataset.old,row[0].value,row[1].value);renderManage();return;
  }
  if(el.dataset.merge&&el.value){replaceTag(el.dataset.merge,el.dataset.from,el.value);remove('Tags',`${el.dataset.merge}::${el.dataset.from}`);renderManage();return;}
  if(el.dataset.dimname){
    const key=el.dataset.dimname+'::';patch('Tags',key,{[el.dataset.l==='zh'?'dim_zh':'dim_en']:el.value.trim()});return;
  }
  if(el.id==='picker'){const f=[...el.files];el.value='';importFiles(f);}
  if(el.id==='draftpicker'&&el.files[0]){const f=el.files[0];el.value='';importDrafts(f);}
});
document.addEventListener('keydown',e=>{
  const typing=/TEXTAREA|INPUT|SELECT/.test(e.target.tagName);
  if(e.key==='Enter'&&e.target.dataset.newtag){
    e.preventDefault();
    const el=e.target,id=el.dataset.id;
    addTag(el.dataset.newtag,el.value,id).then(()=>{if(!id)renderManage();});
    el.value='';return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row-sum')){e.preventDefault();toggleRow(e.target.dataset.id);return;}
  if(e.key==='Escape'){
    if(!$('#modal').hidden){if(S.askDone)S.askDone(false);else{closeModal();afterManage();}return;}
    if(S.focus!==null){exitFocus();return;}
    if(S.pop){S.pop=null;renderFilter();return;}
    if(S.open){const id=S.open;toggleRow(id);return;}
  }
  if(S.focus!==null){
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();fxGo(1);return;}
    if(!typing&&e.key==='ArrowRight')fxGo(1);
    if(!typing&&e.key==='ArrowLeft')fxGo(-1);
  }
});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.classList.add('broken');},true);
document.addEventListener('load',e=>{
  const el=e.target;
  if(el.tagName!=='IMG'||!el.naturalWidth||!el.closest('.hcell'))return;
  const id=el.closest('.hcell').getAttribute('href').split('/').pop(),r=byId(id);
  if(r&&!(+r.width&&+r.height)&&!S.aspect[id]){S.aspect[id]=el.naturalWidth/el.naturalHeight;queueHero();}
},true);
window.addEventListener('hashchange',()=>route());
window.addEventListener('resize',()=>{queueHero();growAll(document);});
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(!hasFiles(e)||!canEdit())return;e.preventDefault();dragDepth++;const d=$('#drop');d.textContent=t('dropHere');d.hidden=false;});
window.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').hidden=true;});
window.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$('#drop').hidden=true;if(canEdit())importFiles(e.dataTransfer.files);});

load();
</script>
